---
- name: Confirm Olympus RKE2 configuration is defined
  ansible.builtin.assert:
    that:
      - rke2_api_endpoint | length > 0
      - rke2_api_vip | length > 0
      - rke2_token | length >= 32
      - rke2_tls_sans | length > 0
    fail_msg: "Required Olympus RKE2 configuration is incomplete."
    success_msg: "Olympus RKE2 configuration is present."
  no_log: true

- name: Resolve Olympus API endpoint
  ansible.builtin.command:
    cmd: "getent ahostsv4 {{ rke2_api_endpoint }}"
  register: rke2_endpoint_resolution
  changed_when: false
  check_mode: false

- name: Assert Olympus API endpoint resolves to the VIP
  ansible.builtin.assert:
    that:
      - rke2_api_vip in rke2_endpoint_resolution.stdout
    fail_msg: "{{ rke2_api_endpoint }} does not resolve to {{ rke2_api_vip }}."
    success_msg: "Olympus API endpoint resolves to the configured VIP."

- name: Require a pinned RKE2 release
  ansible.builtin.assert:
    that:
      - rke2_version | length > 0
      - rke2_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+$')
    fail_msg: "Set rke2_version to a specific RKE2 release tag."

- name: Check whether RKE2 is installed
  ansible.builtin.stat:
    path: /usr/local/bin/rke2
  register: rke2_binary

- name: Check for previously staged RKE2 installer
  ansible.builtin.stat:
    path: /usr/local/src/install-rke2.sh
  register: rke2_installer_script

- name: Prevent automatic retry of interrupted RKE2 installation
  ansible.builtin.assert:
    that:
      - rke2_binary.stat.exists or not rke2_installer_script.stat.exists
    fail_msg: >-
      An RKE2 installer script exists, but the RKE2 binary is missing.
      A previous installation may have been interrupted.
      Inspect the host before attempting another installation.
    success_msg: "No interrupted RKE2 installer state detected."

- name: Check RKE2 server systemd unit
  ansible.builtin.command:
    cmd: systemctl show --property=LoadState --value rke2-server.service
  register: rke2_service_state
  changed_when: false
  check_mode: false

- name: Verify RKE2 installation consistency
  ansible.builtin.assert:
    that:
      - (rke2_service_state.stdout | trim) in ['loaded', 'not-found']
      - "rke2_binary.stat.exists == ((rke2_service_state.stdout | trim) == 'loaded')"
    fail_msg: "Incomplete RKE2 installation detected. Manual inspection required."
    success_msg: "RKE2 binary and systemd service installation states are consistent."

- name: Read installed RKE2 version
  ansible.builtin.command:
    cmd: /usr/local/bin/rke2 --version
  register: rke2_installed_version
  changed_when: false
  check_mode: false
  when: rke2_binary.stat.exists

- name: Verify installed RKE2 version matches pinned release
  ansible.builtin.assert:
    that:
      - rke2_installed_version.stdout_lines[0].split()[2] == rke2_version
    fail_msg: "Installed RKE2 version differs from {{ rke2_version }}. Manual upgrade review required."
    success_msg: "Installed RKE2 version matches pinned release."
  when: rke2_binary.stat.exists

- name: Gather service state before RKE2 configuration changes
  ansible.builtin.service_facts:

- name: Record whether RKE2 server was already running
  ansible.builtin.set_fact:
    rke2_server_was_running: >-
      {{
        ansible_facts['services']
        .get('rke2-server.service', {})
        .get('state') == 'running'
      }}
  changed_when: false

- name: Prevent unintended startup of existing RKE2 server
  ansible.builtin.assert:
    that:
      - not rke2_binary.stat.exists or rke2_server_was_running | bool
    fail_msg: >-
      RKE2 is installed, but rke2-server is not running.
      Inspect the service before allowing Ansible to proceed.
    success_msg: "RKE2 service state permits deployment."

- name: Create RKE2 configuration directory
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Preview RKE2 configuration changes
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    owner: root
    group: root
    mode: "0600"
  check_mode: true
  diff: false
  no_log: true
  register: rke2_config_preview
  when: rke2_server_was_running | bool

- name: Require approval for active RKE2 configuration changes
  ansible.builtin.assert:
    that:
      - not rke2_config_preview.changed or
        (rke2_restart_approved | default(false) | bool)
    fail_msg: >-
      RKE2 configuration changes require explicit restart approval.
      No configuration changes have been applied.
  when:
    - rke2_server_was_running | bool
    - not ansible_check_mode

- name: Deploy RKE2 server configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart RKE2 server

- name: Download official RKE2 installation script
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/rancher/rke2/{{ rke2_version }}/install.sh"
    dest: /usr/local/src/install-rke2.sh
    owner: root
    group: root
    mode: "0755"
    checksum: "sha256:42983c86d1da64a92061d83afb57630cedd69241989f1b0673f3db6c3d92ee6b"
  when: not rke2_binary.stat.exists

- name: Install pinned RKE2 server release
  ansible.builtin.command:
    cmd: /usr/local/src/install-rke2.sh
    creates: /usr/local/bin/rke2
  environment:
    INSTALL_RKE2_TYPE: server
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
  when: not rke2_binary.stat.exists

- name: Enable and start RKE2 server
  ansible.builtin.systemd_service:
    name: rke2-server
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Apply pending RKE2 configuration restarts
  ansible.builtin.meta: flush_handlers

- name: Wait for Kubernetes API
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    delay: 10
    timeout: 600
  when: not ansible_check_mode

- name: Wait for deployed server node registration
  ansible.builtin.command:
    cmd: >
      /var/lib/rancher/rke2/bin/kubectl
      --kubeconfig /etc/rancher/rke2/rke2.yaml
      get node {{ inventory_hostname }}
  register: rke2_node_check
  until: rke2_node_check.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  when: not ansible_check_mode

- name: Wait for deployed server node to become Ready
  ansible.builtin.command:
    cmd: >
      /var/lib/rancher/rke2/bin/kubectl
      --kubeconfig /etc/rancher/rke2/rke2.yaml
      wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=600s
  changed_when: false
  when: not ansible_check_mode
