---
rke2_api_endpoint: olympus-api.tylerdalton.dev
rke2_api_vip: 192.168.33.10

rke2_tls_sans:
  - olympus-api.tylerdalton.dev
  - 192.168.33.10

rke2_token: "{{ vault_rke2_token }}"

# RKE2 release — populate after verifying compatibility
rke2_version: "v1.37.1+rke2r1"
rke2_cni: cilium

rke2_disable_kube_proxy: true

rke2_cilium_kube_proxy_replacement: true
rke2_cilium_gateway_api_enabled: true
rke2_cilium_l2_announcements_enabled: true
rke2_cilium_k8s_service_host: "{{ rke2_api_vip }}"
rke2_cilium_k8s_service_port: "6443"
rke2_cilium_k8s_client_qps: 20
rke2_cilium_k8s_client_burst: 40
