apiVersion: v1
kind: PersistentVolume
metadata:
  name: olympus-keycloak-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /var/lib/olympus-storage/postgresql
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - daedalus
