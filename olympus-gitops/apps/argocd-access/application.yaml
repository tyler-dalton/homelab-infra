apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: olympus-argocd-access
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: olympus
  source:
    repoURL: https://github.com/tyler-dalton/homelab-infra.git
    targetRevision: main
    path: olympus-gitops/apps/argocd-access/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
