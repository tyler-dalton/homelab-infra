apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  policy.default: role:readonly
  policy.csv: |
    g, /argocd-admins, role:admin
  scopes: '[groups]'
