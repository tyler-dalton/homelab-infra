apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  kustomize.buildOptions: "--enable-helm"

  url: https://argocd.tylerdalton.dev

  oidc.config: |
    name: Keycloak
    issuer: https://keycloak.apps.tylerdalton.dev/realms/olympus
    clientID: argocd
    clientSecret: $oidc.keycloak.clientSecret
    requestedScopes:
      - openid
      - profile
      - email
      - groups
