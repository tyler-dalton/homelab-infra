apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: olympus-sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: olympus
  source:
    repoURL: https://github.com/tyler-dalton/homelab-infra.git
    targetRevision: main
    path: olympus-gitops/apps/sealed-secrets
    kustomize:
      version: v5.7.0
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
