apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: olympus
  namespace: argocd
spec:
  description: Public GitOps configuration for the Olympus RKE2 cluster
  sourceRepos:
    - https://github.com/tyler-dalton/homelab-infra.git
    - https://charts.jetstack.io
    - ghcr.io/actions/actions-runner-controller-charts
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
