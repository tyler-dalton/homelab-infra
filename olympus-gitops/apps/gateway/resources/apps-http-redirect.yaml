apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apps-http-redirect
  namespace: gateway-system
spec:
  parentRefs:
    - name: olympus
      sectionName: apps-http
  hostnames:
    - '*.apps.tylerdalton.dev'
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
