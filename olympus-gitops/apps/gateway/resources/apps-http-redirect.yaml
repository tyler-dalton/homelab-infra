apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apps-http-redirect
  namespace: gateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: olympus
      sectionName: apps-http
  hostnames:
    - '*.apps.tylerdalton.dev'
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
