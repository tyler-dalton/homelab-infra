apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: k8s-http-redirect
  namespace: gateway-system
spec:
  parentRefs:
    - name: olympus
      sectionName: k8s-http
  hostnames:
    - "*.k8s.tylerdalton.dev"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
