apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-http-redirect
  namespace: gateway-system
spec:
  parentRefs:
    - name: olympus
      sectionName: argocd-http
  hostnames:
    - argocd.tylerdalton.dev
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
