apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: olympus-gateway-tls
  namespace: gateway-system
spec:
  secretName: olympus-gateway-tls
  commonName: argocd.tylerdalton.dev
  dnsNames:
    - argocd.tylerdalton.dev
    - '*.apps.tylerdalton.dev'
  issuerRef:
    name: olympus-internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    rotationPolicy: Always
  duration: 2160h
  renewBefore: 360h
