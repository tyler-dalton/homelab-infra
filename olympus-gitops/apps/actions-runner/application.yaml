apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: olympus-actions-runner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: olympus
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.15.0
    helm:
      releaseName: olympus-ansible
      values: |
        githubConfigUrl: https://github.com/tyler-dalton/homelab-infra
        githubConfigSecret: olympus-arc-github-auth
        runnerScaleSetName: olympus-ansible
        minRunners: 0
        maxRunners: 1
        controllerServiceAccount:
          namespace: arc-system
          name: arc-controller-gha-rs-controller
        template:
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 1001
              runAsGroup: 1001
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:2.328.0
                command: ["/home/runner/run.sh"]
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: "2"
                    memory: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
